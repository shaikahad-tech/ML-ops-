groups:
  - name: mlops-alerts
    rules:
      - alert: HighPredictionLatency
        expr: histogram_quantile(0.99, rate(mlops_prediction_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prediction p99 latency > 500ms"
      - alert: ModelNotLoaded
        expr: mlops_model_info == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No model loaded in serving API"
      - alert: HighErrorRate
        expr: rate(mlops_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error rate > 0.1/s"
